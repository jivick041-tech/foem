<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FOEM 修練場｜明志科大材料系 黃裕清老師實驗室</title>
<link rel="stylesheet" href="katex/katex.min.css">
<script defer src="katex/katex.min.js"></script>
<script defer src="katex/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#0f1729; --bg2:#16213a; --card:#fffdf8; --ink:#1d2433; --mute:#6b7280;
  --sun:#f59e0b; --sun2:#fbbf24; --red:#ef4444; --green:#16a34a; --blue:#2563eb; --violet:#7c3aed;
  --line:#e7e2d6; --soft:#fff6e3; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 50% -10%,#fbbf24 0,#f59e0b 12%,#7c2d12 30%,#0f1729 62%)}
.gatebox{background:var(--card);border-radius:20px;max-width:420px;width:100%;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.gatebox h1{margin:0 0 4px;font-size:24px}
.gatebox .sub{color:var(--mute);font-size:14px;margin-bottom:18px}
.field{margin:12px 0}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.field input{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.field input:focus{outline:none;border-color:var(--sun)}
.btn{background:var(--sun);color:#1d1300;border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn:hover{filter:brightness(1.05)}
.btn.wide{width:100%;padding:12px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.btn.small{padding:5px 10px;font-size:14px}
.btn.blue{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--red);font-size:14px;min-height:20px;margin-top:6px}
.ticket{border:2px dashed var(--sun);border-radius:14px;padding:12px 14px;background:var(--soft);font-size:14px;margin-bottom:14px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
header.top{background:var(--bg2);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.brand{font-weight:800;font-size:18px;white-space:nowrap}
.brand span{color:var(--sun2)}
.player{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:14px}
.lv{background:var(--sun);color:#1d1300;border-radius:999px;padding:2px 10px;font-weight:800}
.xpbar{width:130px;height:9px;background:#334155;border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun2),var(--sun));width:0}
nav.tabs{display:flex;gap:4px;background:var(--bg2);padding:0 10px 8px;overflow-x:auto}
.stick{position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.3)}
nav.tabs button{background:transparent;color:#cbd5e1;border:0;padding:7px 12px;border-radius:9px;white-space:nowrap;font-weight:600}
nav.tabs button.on{background:#273553;color:#fff}
main{max-width:980px;margin:0 auto;padding:18px 14px 80px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:0 4px 18px rgba(0,0,0,.18)}
h2,h3,h4{line-height:1.35}
.muted{color:var(--mute)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:#eef2ff;color:#3730a3;margin-right:4px}
.pill.sun{background:#fef3c7;color:#92400e}
.pill.green{background:#dcfce7;color:#166534}
.pill.red{background:#fee2e2;color:#991b1b}
.pill.gray{background:#f1f5f9;color:#475569}

/* ---------- map ---------- */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.stage{background:var(--card);border-radius:var(--r);padding:16px;position:relative;cursor:pointer;transition:transform .12s;border:2px solid transparent}
.stage:hover{transform:translateY(-2px);border-color:var(--sun)}
.stage.locked{opacity:.55;filter:grayscale(.7)}
.stage .no{font-size:13px;color:var(--mute);font-weight:700}
.stage .ic{font-size:30px;float:right}
.stage h3{margin:4px 0 6px;font-size:18px}
.prog{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--green)}
.crown{position:absolute;top:-10px;left:-8px;font-size:24px}
.welcome{color:#e2e8f0}
.welcome h2{color:#fff;margin:6px 0}

/* ---------- chapter ---------- */
.chhead{background:linear-gradient(135deg,#1e293b,#334155);color:#fff;border-radius:var(--r);padding:20px;margin-top:6px}
.chhead h2{margin:4px 0}
.chhead .src{font-size:13px;color:#cbd5e1}
.goals{margin:8px 0 0;padding-left:20px}
.path{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.node{border:2px solid #475569;color:#e2e8f0;background:#1e293b;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.node.done{background:var(--green);border-color:var(--green);color:#fff}
.node.cur{border-color:var(--sun2)}
.concept h3{margin:0 0 4px}
.sec{border-left:4px solid var(--line);padding:4px 0 4px 14px;margin:14px 0}
.sec>.h{font-weight:800;margin-bottom:4px;font-size:15px}
.sec.plain{border-color:var(--sun)} .sec.plain>.h{color:#b45309}
.sec.pre{border-color:var(--violet)} .sec.pre>.h{color:var(--violet)}
.sec.deep{border-color:var(--blue)} .sec.deep>.h{color:var(--blue)}
.sec.form{border-color:#0891b2} .sec.form>.h{color:#0e7490}
.sec.ext{border-color:#db2777} .sec.ext>.h{color:#be185d}
.sec.quiz{border-color:var(--green)} .sec.quiz>.h{color:var(--green)}
.fig{margin:8px 0 14px;text-align:center} .fig canvas{width:100%;max-width:620px;display:block;margin:0 auto} .fig svg{max-width:100%;height:auto} .fig figcaption{font-size:13px;color:#475569;margin-top:4px;text-align:left;max-width:620px;margin-left:auto;margin-right:auto} .sec.figs{border-color:#0ea5e9} .sec.figs>.h{color:#0369a1} .fx2{margin-top:5px;font-size:14.5px}
#aifab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;border:none;background:linear-gradient(135deg,#6366f1,#0ea5e9);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;z-index:50;display:none} body.in #aifab{display:block} .sec.aibox{border-color:#6366f1} .sec.aibox>summary.h{color:#4338ca;cursor:pointer} .aians{background:#f5f3ff;border-radius:10px;padding:10px} .aiq{font-weight:700;margin-bottom:6px} .aia{line-height:1.75}
.sec.derive{border-color:#7c3aed} .sec.derive>summary.h{color:#6d28d9;cursor:pointer}
.dtab{border-collapse:collapse;font-size:14px;margin:8px 0} .dtab td,.dtab th{border:1px solid #e5e7eb;padding:3px 8px;text-align:right} .dtab th{background:#f3f4f6}
.dplot{width:100%;max-width:560px;height:260px;display:block;margin:6px 0}
.prebox{background:#f5f3ff;border-radius:10px;padding:8px 12px;margin:6px 0}
.prebox b{color:#5b21b6}
details{margin:6px 0}
details>summary{cursor:pointer;font-weight:700}
.fcard{background:#ecfeff;border:1px solid #a5f3fc;border-radius:12px;padding:10px 14px;margin:10px 0}
.fcard .fn{font-weight:800;color:#0e7490}
.fcard table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
.fcard td{border-top:1px solid #cffafe;padding:4px 6px;vertical-align:top}
.fcard td:first-child{white-space:nowrap;width:1%}
.analogy{background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0}
.warn{background:#fef2f2;border-radius:10px;padding:8px 12px;margin:8px 0}
.srcline{font-size:12px;color:var(--mute);margin-top:10px}
table.data{border-collapse:collapse;font-size:14px;margin:8px 0}
table.data td,table.data th{border:1px solid var(--line);padding:4px 8px}
table.data th{background:#f8f5ec}

/* quiz */
.q{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px;margin:10px 0}
.q .qt{font-weight:600;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:8px 12px;margin:6px 0}
.opt:hover{border-color:var(--sun)}
.opt.right{border-color:var(--green);background:#f0fdf4}
.opt.wrong{border-color:var(--red);background:#fef2f2}
.fb{margin-top:6px;font-size:15px;border-radius:10px;padding:8px 12px}
.fb.ok{background:#f0fdf4;color:#14532d}
.fb.no{background:#fef2f2;color:#7f1d1d}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{width:150px;padding:7px 10px;border:1.5px solid #cbd5e1;border-radius:9px}
.stars button{background:none;border:0;font-size:24px;padding:0 2px;color:#d1d5db}
.stars button.on{color:var(--sun)}
.rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fffbeb;border-radius:10px;padding:8px 12px;margin-top:12px}
.rate textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:6px}

/* problems */
.prob .lvl{color:var(--sun)}
.step{background:#f8fafc;border-radius:10px;padding:8px 12px;margin:6px 0;border-left:4px solid #94a3b8}
.step .sh{font-weight:700;color:#334155}

/* boss */
.boss{background:linear-gradient(160deg,#3b0764,#1e1b4b);color:#fff;border-radius:var(--r);padding:18px}
.boss .q{background:#fff;color:var(--ink)}
.hp{height:16px;background:#4c1d95;border-radius:9px;overflow:hidden;margin:6px 0 10px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#f43f5e,#fb7185);transition:width .4s}
.hearts{font-size:22px;letter-spacing:2px}
.bossart{font-size:64px;text-align:center;line-height:1.1}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* toast & modal */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:#111827;color:#fff;border-radius:12px;padding:9px 16px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:600;animation:pop .25s}
.t.xp{background:linear-gradient(90deg,#b45309,#f59e0b)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.7);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--card);border-radius:18px;max-width:460px;width:100%;padding:22px;text-align:center}
.cardart{font-size:56px}

/* tools */
.tool canvas{width:100%;height:300px;background:#fff;border:1px solid var(--line);border-radius:10px}
.ctl{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px;margin:10px 0}
.ctl label{font-size:14px;display:block}
.ctl input[type=range]{width:100%}
.ctl b{color:var(--blue)}
.out{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.out div{background:#f1f5f9;border-radius:10px;padding:6px 12px;font-size:14px}
.out b{font-size:17px}

/* lists */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{border-radius:12px;padding:10px;text-align:center;background:#f8fafc;border:1px solid #e2e8f0;font-size:13px}
.badge .e{font-size:30px}
.badge.off{opacity:.35;filter:grayscale(1)}
.board td,.board th{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left}
.board{border-collapse:collapse;width:100%}
.me{background:#fef3c7}
.search{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
@media (max-width:600px){ header.top{padding:6px 10px;gap:6px} .player{gap:6px;font-size:13px} #pTitle{display:none} .xpbar{width:70px} .brand{font-size:16px} main{padding:10px 8px 80px} .card{padding:14px} }

/* ---- 專題比較卡、儀器分析 ---- */
.mopt{display:block;cursor:pointer} .mopt input{margin-right:6px}
.story{position:relative;margin:10px 0 4px;padding-left:34px}
.story:before{content:'';position:absolute;left:13px;top:6px;bottom:6px;width:2px;background:#c7d2fe}
.step{position:relative;margin:0 0 14px}
.step>.sn{position:absolute;left:-34px;top:0;width:26px;height:26px;border-radius:50%;background:#6366f1;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.step>.stt{font-weight:800;color:#3730a3;margin-bottom:3px}
.step.key>.sn{background:#db2777} .step.key>.stt{color:#be185d}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0} .cmp th,.cmp td{border:1px solid #e2e8f0;padding:6px 8px;vertical-align:top;text-align:left} .cmp td:first-child{min-width:110px} .cmp td{min-width:90px} .cmp th{background:#eef2ff;color:#3730a3;white-space:nowrap} .cmp tr:nth-child(even) td{background:#fafafa}
.tblwrap{overflow-x:auto}
.chainrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:5px 0} .chainrow>div{border-radius:8px;padding:6px 8px;font-size:13.5px} .chainrow .c1{background:#eff6ff} .chainrow .c2{background:#f0fdf4} .chainrow .c3{background:#fef2f2}
.chainhead{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;font-weight:800;color:#475569}
.proto{background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:6px 10px;font-size:13px;color:#92400e;margin:6px 0}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.icard{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;cursor:pointer;transition:.15s} .icard:hover{border-color:#6366f1;box-shadow:0 4px 14px rgba(99,102,241,.15)}
.icard .ic{font-size:26px} .icard b{display:block;margin:2px 0} .icard .muted{font-size:13px}
.mtx{border-collapse:collapse;font-size:13px} .mtx th,.mtx td{border:1px solid #e2e8f0;padding:5px 7px;text-align:center} .mtx td:first-child,.mtx th:first-child{text-align:left;white-space:nowrap} .mtx td.y{background:#dcfce7;color:#166534;font-weight:800;cursor:pointer} .mtx td.o{background:#fef9c3;color:#854d0e;cursor:pointer} .mtx th.ih{cursor:pointer;color:#3730a3;white-space:nowrap;font-size:12px}
.mtip{background:#f8fafc;border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px;min-height:20px}
.meas{width:100%;border-collapse:collapse;font-size:14px} .meas td,.meas th{border:1px solid #e2e8f0;padding:6px 8px;vertical-align:top} .meas th{background:#f0fdfa;color:#115e59;text-align:left}
.exbox{border:1.5px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.read3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0} .read3>div{border-radius:8px;padding:6px 8px;font-size:13.5px} .read3 .r1{background:#eff6ff} .read3 .r2{background:#f5f3ff} .read3 .r3{background:#fff7ed}
@media(max-width:640px){.chainrow,.chainhead,.read3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===================== 入場門票 ===================== -->
<div id="gate">
  <div class="gatebox">
    <div style="font-size:44px">⚛️🔑</div>
    <h1>FOEM 修練場</h1>

    <div id="stepTicket">

</div>

<!-- ===================== 主程式 ===================== -->

  </div>

</div>

<div id="toast"></div>

<script>

<script>
"use strict";
/* ============================================================
   FOEM 修練場 engine
   ============================================================ */
const CH = [];            // chapters (filled after decrypt)
const GLOSS = [];         // glossary entries
const CARDS = [];         // collectible scientist cards
const PLACEMENT = [];     // 入門資質鑑定題
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decryptPayload(pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct));
  return new TextDecoder().decode(buf);
}

async function decryptView(code) {
  const V = PAYLOAD.vk; if (!V) throw new Error('noview');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code.normalize('NFKC').trim()), 'PBKDF2', false, ['deriveKey']);
  const vk = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(V.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const raw = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(V.iv) }, vk, b64(V.ct));
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct)));
}

function applyDecay(prevDay) {

function checkConceptPass(c, k) {

/* ---------------- calculation problems ---------------- */
function dataBlock(D) {
  const tbl = `<table class="dtab"><tr>${D.cols.map(c => `<th>${c}</th>`).join('')}</tr>${D.rows.map(r => `<tr>${r.map(v => `<td>${v}</td>`).join('')}</tr>`).join('')}</table>`;
  return `<div class="databox">${D.note ? `<div class="muted" style="font-size:13px">${D.note}</div>` : ''}${D.plot ? '<canvas class="dplot"></canvas>' : ''}<details${D.plot ? '' : ' open'}><summary class="muted">📋 數據表（可複製到 Excel 擬合）</summary>${tbl}</details></div>`;
}
function drawData(d, D) {
  const cv = d.querySelector('canvas.dplot'); if (!cv) return;
  const P = D.plot, tx = v => P.logx ? Math.log10(v) : v, ty = v => P.logy ? Math.log10(v) : v;
  const pts = D.rows.map(r => [tx(+r[P.x]), ty(+r[P.y])]).filter(p => isFinite(p[0]) && isFinite(p[1]));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const pad = (a, b) => { const m = (b - a) * 0.08 || 1; return [a - m, b + m]; };
  const series = P.line ? [{ pts, c: '#2563eb' }] : [];
  plot(cv, { x: P.xr || pad(Math.min(...xs), Math.max(...xs)), y: P.yr || pad(Math.min(...ys), Math.max(...ys)), xl: P.xl, yl: P.yl, series, dots: P.line ? [] : pts.map(p => ({ x: p[0], y: p[1], c: '#ef4444' })) });
}
function renderProblems(c, el) {
  if (!c.problems || !c.problems.length) return;
  el.innerHTML = `<div class="card"><h3 style="margin:0">🧮 習題演練與計算</h3><div class="muted" style="font-size:14px">先自己算！卡住時再逐步打開提示（每打開一步，這題得到的 XP 會少一點）。答案允許約 ±3–5% 的誤差。</div></div>`;
  c.problems.forEach(p => {
    const d = document.createElement('div'); d.className = 'card prob';
    const st = S.prob[p.id] || {};
    d.innerHTML = `<div><span class="pill ${st.ok ? 'green' : 'sun'}">${st.ok ? '已解出' : p.id}</span> <b>${p.title || ''}</b> <span class="lvl">${'★'.repeat(p.lvl || 1)}</span></div>
      <div style="margin-top:6px">${p.q}</div>
      ${p.data ? dataBlock(p.data) : ''}
      <div class="steps"></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost small hintb">💡 下一步提示 (0/${(p.steps || []).length})</button></div>
      <div class="ans"></div>${p.src ? `<div class="srcline">📚 ${p.src}</div>` : ''}`;
    const steps = $('.steps', d), hb = $('.hintb', d);
    let shown = 0;
    const showStep = () => {
      const s = p.steps[shown]; const e = document.createElement('div'); e.className = 'step';
      e.innerHTML = `<div class="sh">第 ${shown + 1} 步｜${s.h}</div><div>${s.c}</div>`; steps.appendChild(e); typeset(e);
      shown++; hb.textContent = `💡 下一步提示 (${shown}/${p.steps.length})`; if (shown >= p.steps.length) hb.disabled = true;
    };
    hb.onclick = () => {
      if (!p.steps || shown >= p.steps.length) return;
      showStep();
      const rec = S.prob[p.id] || {}; rec.hints = Math.max(rec.hints || 0, shown); S.prob[p.id] = rec; save(false);
    };
    if (!p.steps || !p.steps.length) hb.classList.add('hidden');
    const A = $('.ans', d);
    (p.parts || [{ ans: p.ans, tol: p.tol, unit: p.unit, label: p.label }]).forEach((pt, j) => {
      if (pt.ans == null) return;
      const w = document.createElement('div'); w.className = 'numin'; w.style.marginTop = '8px';
      w.innerHTML = `<span>${pt.label || '你的答案'}：</span><input placeholder="數值"><span>${pt.unit || ''}</span><button class="btn small green">檢查</button><span class="r"></span>`;
      const inp = $('input', w);
      $('button', w).onclick = () => {
        const ok = checkNum(inp.value, { ans: pt.ans, tol: pt.tol == null ? 0.05 : pt.tol, abstol: pt.abstol });
        if (ok == null) return toast('請輸入數字');
        const r = $('.r', w); r.innerHTML = ok ? '⭕ 正確！' : '❌ 再算算看';
        const rec = S.prob[p.id] || {}; rec.parts = rec.parts || {}; rec.tries = (rec.tries || 0) + 1;
        if (ok) rec.parts[j] = 1;
        const nParts = (p.parts || [1]).filter(x => x.ans != null || !p.parts).length;
        const wasOk = rec.ok;
        rec.ok = Object.keys(rec.parts).length >= nParts;
        rec.hints = Math.max(rec.hints || 0, shown);
        S.prob[p.id] = rec; save();
        Rec.send('problem', { ch: c.id, item: p.id + (p.parts ? '.' + (j + 1) : ''), correct: ok ? 1 : 0, tries: rec.tries, hints: shown });
        if (!ok) { S.wrong['P:' + p.id] = { q: p.id + '（計算題）', ch: c.id, t: Date.now() }; S.wrongEver = S.wrongEver || {}; S.wrongEver['P:' + p.id] = 1; save(false); }
        if (rec.ok && !wasOk) {
          delete S.wrong['P:' + p.id];
          const base = 15 * (p.lvl || 1), n = (p.steps || []).length || 1;
          const gain = Math.max(5, Math.round(base * (1 - 0.6 * shown / n)));
          addXP(gain, shown ? `解題（看了 ${shown} 步提示）` : '獨立解題！');
          d.querySelector('.pill').className = 'pill green'; d.querySelector('.pill').textContent = '已解出';
          if (p.after) { const e = document.createElement('div'); e.className = 'analogy'; e.innerHTML = '🧠 <b>解完想一想：</b>' + p.after; d.appendChild(e); typeset(e); }
        }
      };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') $('button', w).click(); });
      A.appendChild(w);
    });
    if (p.full) {
      const det = document.createElement('details'); det.innerHTML = `<summary class="muted">📖 看完整詳解（建議算完再看）</summary><div>${p.full}</div>`;
      det.addEventListener('toggle', () => { if (det.open) { typeset(det); const rec = S.prob[p.id] || {}; rec.hints = (p.steps || []).length || 1; S.prob[p.id] = rec; save(false); } });
      d.appendChild(det);
    }
    el.appendChild(d);
    if (p.data && p.data.plot) requestAnimationFrame(() => drawData(d, p.data));
  });
}

/* ---------------- boss battle ---------------- */
function renderBossIntro(c, el) {
  if (!c.boss) return;
  const B = c.boss, st = S.boss[c.id] || {};
  const passed = c.concepts.filter(k => S.concept[k.id]).length, need = Math.ceil(c.concepts.length * (CONFIG.BOSS_REQ == null ? 0.6 : CONFIG.BOSS_REQ));
  el.innerHTML = `<div class="boss"><div class="bossart">${B.art || '👹'}</div>
    <h3 style="text-align:center;margin:4px 0">章節魔王：${B.name}</h3>
    <p style="text-align:center;color:#ddd6fe">${B.intro || ''}</p>
    <p style="text-align:center;font-size:14px;color:#c4b5fd">規則：隨機出 ${B.n || 6} 題，答對就攻擊魔王；答錯會扣你 1 顆 ❤️（共 3 顆）。魔王血量歸零即勝利，可獲得 100 XP 與一張隨機科學家卡。<br>挑戰條件：至少通過本章 ${need} 個觀念節點（目前 ${passed}）。${st.win ? '<br>✅ 你已經擊敗過牠，可以再挑戰練習。' : ''}</p>
    <div style="text-align:center"><button class="btn" id="bossGo" ${passed < need ? 'disabled' : ''}>⚔️ 開始挑戰</button></div><div id="arena"></div></div>`;
  $('#bossGo', el).onclick = () => startBoss(c, el);
  typeset(el);
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startBoss(c, el) {
  const B = c.boss;
  let pool = (B.pool || []).map((q, j) => ({ q, key: `B${c.id}#${j}` }));
  c.concepts.forEach(k => (k.quiz || []).forEach((q, j) => pool.push({ q, key: `${k.id}#${j}` })));
  // 優先出 boss 專屬題，再補觀念題
  const own = shuffle(pool.filter(x => x.key[0] === 'B')), rest = shuffle(pool.filter(x => x.key[0] !== 'B'));
  const N = B.n || 6;
  const qs = own.slice(0, Math.ceil(N / 2)).concat(rest).slice(0, N);
  let hp = qs.length, hearts = 3, idx = 0;
  const A = $('#arena', el); $('#bossGo', el).classList.add('hidden');
  const t0 = Date.now();
  const draw = () => {
    A.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span>👹 ${B.name}</span><span class="hearts">${'❤️'.repeat(hearts)}${'🖤'.repeat(3 - hearts)}</span></div>
      <div class="hp"><i style="width:${hp / qs.length * 100}%"></i></div><div id="bq"></div>`;
    if (hp <= 0) return finish(true);
    if (hearts <= 0 || idx >= qs.length) return finish(hp <= 0);
    const item = qs[idx];
    const box = $('#bq', A);
    box.appendChild(renderQ(item.q, item.key, { ch: c.id, fresh: true, onDone: ok => {
      $$('.opt,button', box).forEach(b => b.disabled = true);
      if (ok) { hp--; toast('💥 命中魔王！'); } else { hearts--; A.classList.add('shake'); setTimeout(() => A.classList.remove('shake'), 400); }
      const nx = document.createElement('button'); nx.className = 'btn'; nx.style.marginTop = '8px'; nx.textContent = '下一回合 ▶';
      nx.onclick = () => { idx++; draw(); typeset(A); };
      box.appendChild(nx);
      if (hp <= 0 || hearts <= 0) { nx.textContent = '看結果 ▶'; }
    } }));
    typeset(A);
  };
  const finish = win => {
    const secs = Math.round((Date.now() - t0) / 1000);
    const st = S.boss[c.id] || { tries: 0 }; st.tries++; const first = !st.win;
    if (win) st.win = true; S.boss[c.id] = st; save();
    Rec.send('boss', { ch: c.id, correct: win ? 1 : 0, score: `${qs.length - hp}/${qs.length}`, hearts, secs });
    if (win) {
      let card = null;
      if (first) { addXP(100, `擊敗 ${B.name}`); card = dropCard(); } else addXP(15, '再次討伐');
      A.innerHTML = `<div style="text-align:center;padding:10px"><div class="bossart">🏆</div><h3>勝利！${B.name} 被擊敗了</h3>
        ${B.outro ? `<p>${B.outro}</p>` : ''}${card ? `<p>你獲得一張科學家卡：<b>${card.e} ${card.n}</b>（到「成就與排行」查看）</p>` : ''}
        <button class="btn" onclick="go('map')">回地圖，前往下一章 ▶</button></div>`;
    } else {
      A.innerHTML = `<div style="text-align:center;padding:10px"><div class="bossart">💫</div><h3>這次被打倒了…</h3><p>到「❌ 錯題本」看看哪裡出錯，複習後再來！</p>
        <button class="btn" id="again">再挑戰一次</button></div>`;
      $('#again', A).onclick = () => startBoss(c, el);
    }
    typeset(A);
  };
  draw();
}
function dropCard() {
  const have = new Set(S.cards || []); const left = CARDS.filter(k => !have.has(k.id));
  if (!left.length) return null;
  const k = left[Math.floor(Math.random() * left.length)];
  S.cards = (S.cards || []).concat(k.id); save();
  setTimeout(() => modal(`<div class="cardart">${k.e}</div><h3>🃏 新科學家卡！</h3><h2 style="margin:4px 0">${k.n}</h2><div class="muted">${k.y || ''}</div><p style="text-align:left">${k.d}</p><button class="btn" onclick="closeModal()">收下</button>`), 600);
  return k;
}

function hashStr(t) { let h = 2166136261; for (const ch of String(t)) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ARENA_SCOPES = { pv: '☀️ 課程一', ec: '⚗️ 課程二', oe: '🌈 課程三', oc: '🧪 課程四', pm: '🔗 課程五', all: '🌐 全部課程', basic: '🟦 只考基本知識' };
function arenaPool(scope) {
  const out = [];
  CH.forEach(c => { if (COURSES[scope]) { if (c.course !== scope) return; } else if (scope === 'basic' && c.part !== 'basic') return;
    c.concepts.forEach(k => (k.quiz || []).forEach((q, j) => out.push(k.id + '#' + j))); });
  return out.sort();
}
function arenaQ(key) { const [kid, j] = key.split('#'); const f = findConcept(kid); return f ? { q: f.k.quiz[+j], c: f.c, k: f.k } : null; }
function arenaPick(scope, seed, n = 5) { const P = arenaPool(scope), r = rng32(hashStr(seed)), out = []; const used = new Set();
  while (out.length < Math.min(n, P.length)) { const i = Math.floor(r() * P.length); if (!used.has(i)) { used.add(i); out.push(P[i]); } } return out; }
const ARENA = { data: null };

// 出題、計時、計分（每題 30 秒；答對 100 分＋速度加分最多 50）
function playArena(title, keys, onEnd) {
  let i = 0, score = 0, correct = 0, secs = 0, timer = null, t0 = 0; const log = []; ARENA.playing = true;
  const box = document.createElement('div');
  const next = () => {
    clearInterval(timer);
    if (i >= keys.length) { ARENA.playing = false; closeModal(); return onEnd({ score, correct, secs: Math.round(secs), log }); }
    const A = arenaQ(keys[i]); if (!A) { i++; return next(); }
    const q = A.q; t0 = Date.now(); let left = 30, answered = false;
    modal(`<div style="text-align:left"><div style="display:flex;justify-content:space-between"><b>${title}</b><span>第 ${i + 1}/${keys.length} 題・<span id="atm">30</span> 秒・${score} 分</span></div>
      <div class="muted" style="font-size:12px">出自 ${esc(A.c.label)}｜${esc(A.k.id)} ${esc(A.k.title)}</div><div class="q"><div class="qt">${q.q}</div><div class="body" id="abody"></div><div class="fbx" id="afb"></div></div></div>`);
    const body = $('#abody'), fb = $('#afb');
    const done = ok => {
      if (answered) return; answered = true; clearInterval(timer);
      const dt = (Date.now() - t0) / 1000; secs += dt;
      if (ok) { correct++; score += 100 + Math.max(0, Math.round(50 - 2 * dt)); } else { S.wrong[keys[i]] = { ch: A.c.id, t: Date.now() }; S.wrongEver = S.wrongEver || {}; S.wrongEver[keys[i]] = 1; }
      log.push(ok ? 1 : 0);
      fb.innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '⭕ 答對！' : '❌ ' + (q.type === 'num' ? '正確答案：' + q.ans + ' ' + (q.unit || '') : '正確答案：' + q.opts[q.a])} ${q.why ? '<br>' + q.why : ''}</div><button class="btn" id="anext">${i + 1 < keys.length ? '下一題 →' : '看結果'}</button>`;
      typeset(fb); $('#anext').onclick = () => { i++; next(); };
    };
    if (q.type === 'num') {
      body.innerHTML = `<div class="numin"><input id="ain" placeholder="輸入數值"> <span>${q.unit || ''}</span><button class="btn small" id="ago">送出</button></div>`;
      $('#ago').onclick = () => { const r = checkNum($('#ain').value, q); if (r == null) return toast('請輸入數字'); done(r); };
      $('#ain').addEventListener('keydown', e => { if (e.key === 'Enter') $('#ago').click(); }); $('#ain').focus();
    } else shuffle(q.opts.map((o, j) => j)).forEach(j => { const b = document.createElement('button'); b.className = 'opt'; b.innerHTML = q.opts[j];
      b.onclick = () => { b.classList.add(j === q.a ? 'right' : 'wrong'); done(j === q.a); }; body.appendChild(b); });
    timer = setInterval(() => { left--; const e = $('#atm'); if (e) e.textContent = left; if (left <= 0) { clearInterval(timer); done(false); } }, 1000);
  };
  next();
}
function duelOutcome(d) { if (d.status !== '完成') return null; if (d.winner === '平手') return 'draw'; return d.winner === S.sid ? 'win' : 'lose'; }
function awardDuels() {

}

function dailyStreak() { const D = S.daily || {}; let n = 0; const d = new Date(); if (!D[nowDay()]) d.setDate(d.getDate() - 1);

const stripHTML = h => { const d = document.createElement('div'); d.innerHTML = String(h || ''); return d.textContent.replace(/\s+/g, ' ').trim(); };
const AI_SITES = [['Claude', 'https://claude.ai/new'], ['ChatGPT', 'https://chatgpt.com/'], ['Gemini', 'https://gemini.google.com/app']];
function aiContextFor(c, k) {
  if (!c) return '';
  let t = `${COURSES[c.course].no}｜${c.label}「${c.title}」`;
  if (k) t += `\n觀念 ${k.id}「${k.title}」\n白話說明：${stripHTML(k.plain)}\n專業說明：${stripHTML(k.deep)}\n相關公式：${(k.formulas || []).map(f => f.name + '：' + f.tex).join('；')}`;
  else t += '\n本章觀念：' + c.concepts.map(x => x.id + ' ' + x.title).join('；');
  return t.slice(0, 3500);
}
function aiPrompt(question, where, context) {
  return `你是一位耐心又嚴謹的助教。我是材料系的學生（大學專題生／碩士生），正在學習「${where}」。
${context ? '\n以下是課程對這部分的說明，請參考並與它一致：\n"""\n' + context + '\n"""\n' : ''}
我的問題：${question}

請用繁體中文回答：
1. 先用兩三句白話講直覺；
2. 再給專業、正確的說明（定義、物理圖像、公式的成立條件與適用範圍）；
3. 指出常見誤解；
4. 如果是計算題，給我思路與第一步，讓我自己算完，不要直接給最終答案；
5. 不確定的地方請直說，不要編造數據或文獻。`;
}
async function aiGo(question, where, cid, context, out) {
  question = (question || '').trim(); if (!question) return toast('請先輸入問題');
  const prompt = aiPrompt(question, where, context);
  let copied = false; try { await navigator.clipboard.writeText(prompt); copied = true; } catch (e) {}
  Rec.send('ask_q', { item: cid || '', comment: question.slice(0, 500), ch: where.slice(0, 60) });
  S.aiN = (S.aiN || 0) + 1; save(); checkBadges();
  out.innerHTML = `<div class="aians">${copied ? '✅ 已把「問題＋這個觀念的課程內容」複製好了。' : '請先複製下方文字：'} 選一個你常用的 AI，打開後在對話框<b>貼上（Ctrl+V）</b>送出即可：
    <div style="margin:8px 0">${AI_SITES.map(([n, u]) => `<a class="btn small" href="${u}" target="_blank" rel="noopener" style="margin:2px">開啟 ${n}</a>`).join('')}</div>
    <details${copied ? '' : ' open'}><summary class="muted" style="font-size:13px">看／手動複製要貼上的文字</summary><textarea readonly style="width:100%;min-height:140px;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px">${esc(prompt)}</textarea></details>
    <div class="muted" style="font-size:12px;margin-top:6px">⚠️ AI 的回答可能有錯，重要結論請對照課本、公式卡或問老師。你的問題（不含 AI 回答）會記錄給老師，幫助老師知道大家卡在哪裡。</div></div>`;
}

async function pullProgress(force) {
  const r = await apiGet({ action: 'progress', sid: S.sid });
  if (r && r.data) {
    try { const remote = JSON.parse(r.data); if (force || (remote.updated || 0) > (S.updated || 0)) { S = Object.assign(blankState(S.sid, S.name), remote, { name: S.name, nick: S.nick || remote.nick }); save(false); renderHUD(); return true; } } catch (e) {}
  }
  return false;
}

const PHY = { q: 1.602e-19, k: 1.381e-23, h: 6.626e-34, c: 2.998e8, kev: 8.617e-5, sigma: 5.67e-8, e0: 8.854e-14 /* F/cm */ };

}
function fmtE(x, d = 2) {
  if (x === 0) return '0';
  let e = Math.floor(Math.log10(Math.abs(x))); let m = +(x / Math.pow(10, e)).toFixed(d - 1);
  if (Math.abs(m) >= 10) { m /= 10; e++; }
  if (e >= -2 && e <= 3) return (+x.toPrecision(d + 1)).toString();
  return m.toFixed(d - 1) + '×10' + String(e).replace('-', '⁻').replace(/\d/g, c => '⁰¹²³⁴⁵⁶⁷⁸⁹'[c]);
}

function bbFlux(Eg, T, Emax) {   // photons m^-2 s^-1 emitted into hemisphere by blackbody at T, for E>Eg ; E in eV

function sqCell(Eg, X, Ts, Ta) {

  return { Jsc, J0, Voc, Pm, Vm, FF: Pm / (Voc * Jsc), eta: Pm / Pin, Pin };
}

      const e1 = arr => { const p = arr.find(q => q[1] < -1 / Math.LN10); return p ? p[0] : NaN; };
      plot(cv, buildPlot({ x: [0, tmax], y: [-4, 0.1], xl: '時間 t (ns)', yl: 'log₁₀ PL(t)/PL(0)', series: [{ pts: pa, c: '#dc2626', label: '你的激發強度', lp: 60 }, { pts: pb, c: '#2563eb', dash: [6, 3], label: '低激發 n₀ = 10¹⁴', lp: 200 },
        { f: t => -2 * t / (t1 * 1e9) / Math.LN10, c: '#9ca3af', dash: [2, 3], label: '斜率對應 τ₁/2', lp: 120 }] }));
      $('#ip_o', d).innerHTML = `<div>SRH 載子壽命 τ₁ = <b>${(t1 * 1e9).toFixed(0)}</b> ns　→ 低激發 PL 尾段衰減時間 = τ₁/2 = <b>${(t1 * 5e8).toFixed(0)}</b> ns</div>
        <div>PL 降到 1/e 的時間：你的條件 <b>${e1(pa).toFixed(0)}</b> ns；低激發 <b>${e1(pb).toFixed(0)}</b> ns</div>
        <div>初始時輻射項與 SRH 項比值 k₂n₀/k₁ = <b>${fmtE(k2 * n0 / k1)}</b>${k2 * n0 / k1 > 1 ? '　→ 前段由雙分子（輻射）複合主導，曲線不是單指數' : ''}</div>`;
    });
  } });

/* ---- I4. SCLC：單載子元件的陷阱填滿與 Mott–Gurney ---- */
TOOLS.push({ id: 'inst_sclc', course: 'inst', icon: '🪤', name: 'SCLC：陷阱密度與遷移率', desc: '單載子元件（只讓電子或只讓電洞通過）的暗 J–V，在雙對數圖上分成歐姆區（斜率 1）、陷阱填滿區（陡升）與 Child 區（斜率 2）。調整陷阱密度、厚度與遷移率，看 V_TFL 與 Mott–Gurney 電流怎麼變。',
  build(d) {
    d.insertAdjacentHTML('beforeend', `<div class="ctl">${slider('sc_nt', 'log₁₀ 陷阱密度 n_t (cm⁻³)', 14, 17, 0.1, 15.5, 'exp')}${slider('sc_L', '厚度 L (nm)', 200, 1500, 10, 500)}
      ${slider('sc_mu', 'log₁₀ 遷移率 μ (cm²/V·s)', -2, 1.5, 0.1, 0, 'exp')}${slider('sc_er', '相對介電常數 ε_r', 10, 60, 1, 30)}</div>
      <canvas id="sc_cv" style="height:250px"></canvas><div class="out" id="sc_o"></div>
      <div class="analogy">🍼 判讀：V_TFL ∝ n_t L²，所以陷阱越少、膜越薄，陡升點越早出現。Child 區的電流 ∝ μV²/L³，可反推遷移率。鈣鈦礦有可動離子，量測要用脈衝或快速掃描，否則離子會改變曲線（13-6、13-8）。</div>`);
    const cv = $('#sc_cv', d), q = 1.602e-19, e0 = 8.854e-14;
    bindSliders(d, () => {
      const nt = Math.pow(10, sv(d, 'sc_nt')), L = sv(d, 'sc_L') * 1e-7, mu = Math.pow(10, sv(d, 'sc_mu')), er = sv(d, 'sc_er');
      const VT = q * nt * L * L / (2 * er * e0), n0 = 1e11, th0 = 1e-4;
      const J = V => q * n0 * mu * V / L + 9 / 8 * er * e0 * mu * V * V / (L ** 3) * (th0 + (1 - th0) / (1 + Math.pow(VT / V, 12)));
      plot(cv, buildPlot({ x: [-2, 1.5], y: [-8, 2], xl: 'log₁₀ V (V)', yl: 'log₁₀ J (A/cm²)', series: [
        { f: x => Math.log10(J(10 ** x)), c: '#2563eb', label: '單載子元件暗 J–V', lp: 240 },
        { f: x => Math.log10(9 / 8 * er * e0 * mu * 10 ** (2 * x) / L ** 3), c: '#9ca3af', dash: [4, 3], label: 'Mott–Gurney（無陷阱）', lp: 60 }],
        vlines: VT > 0.01 && VT < 30 ? [{ x: Math.log10(VT), label: 'V_TFL', c: '#dc2626' }] : [] }));
      $('#sc_o', d).innerHTML = `<div>陷阱填滿電壓 V_TFL = q·n_t·L²/(2εε₀) = <b>${fmtE(VT)}</b> V${VT > 30 ? '（超出量測範圍：陷阱太多或膜太厚）' : ''}</div>
        <div>由 V_TFL 反推：n_t = 2εε₀V_TFL/(qL²) = <b>${fmtE(nt)}</b> cm⁻³</div><div>Child 區 J/V² = 9εε₀μ/(8L³) → 斜率可得 μ = <b>${fmtE(mu)}</b> cm²/V·s</div>`;
    });
  } });


/* ---------------- boot ---------------- */
async function tryTicket(pass, silent) {
  try {
    const src = await decryptPayload(pass);
    loadContent(src);
    LS.set(KEYP + 'ticket', pass);
    return true;
  } catch (e) {
    if (!silent) $('#errTicket').textContent = PAYLOAD.ct ? '❌ 通行碼不正確，請再確認一次（大小寫有分）。' : '❌ 找不到課程內容檔 content.enc.js，請通知老師。';
    return false;
  }
}
async function doLogin(sid, name, nick, silent) {
  sid = sid.trim().toUpperCase(); name = name.trim(); nick = (nick || '').trim().slice(0, 12);
  if (!sid || !name) { $('#errLogin').textContent = '學號和真實姓名都要填喔'; return; }
  if (!nick && !silent) { $('#errLogin').textContent = '請取一個暱稱（會顯示在排行榜上）'; return; }
  if (CONFIG.API && CONFIG.ROSTER && !silent) {
    $('#errLogin').textContent = '核對實驗室名單中…';
    const r = await apiGet({ action: 'check', sid, name });
    if (!r) { $('#errLogin').textContent = '連不上名單伺服器，請確認網路後再試。'; return; }
    if (!r.ok) { $('#errLogin').textContent = '❌ 名單上找不到這個學號＋姓名，請聯絡指導老師加入名單。'; Rec.q.push({ type: 'denied', sid, name, ts: new Date().toISOString(), app: 'PVQuest' }); Rec.flush(); return; }
  }
  S = LS.get(KEYP + 'st_' + sid, null) || blankState(sid, name);
  S.name = name; if (nick) S.nick = nick;
  LS.set(KEYP + 'who', { sid, name, nick: S.nick });
  $('#gate').classList.add('hidden'); $('#app').classList.remove('hidden'); document.body.classList.add('in');
  Rec.init();
  const today = nowDay(), newDay = !S.days.includes(today);
  const DEC = newDay ? applyDecay(S.days[S.days.length - 1]) : null;
  if (newDay) S.days.push(today);
  Rec.send('login', { level: levelOf(effXP()).lv, xp: S.xp, ua: navigator.userAgent.slice(0, 80) });
  renderHUD();
  if (CONFIG.API) { const changed = await pullProgress(false); if (changed) toast('已從雲端載入你的進度'); }
  if (newDay) addXP(5, '今日簽到'); else save(false);
  if (DEC) setTimeout(() => modal(`<div class="cardart">${DEC.st[0]}</div><h2>${DEC.st[1]}</h2><p>${DEC.st[2]}</p><p>被暗影奪走 <b>${DEC.lost}</b> 經驗，目前稱號：<b>${levelOf(effXP()).title}</b></p><p class="muted" style="font-size:14px">重新點燃篝火吧：接下來冒險獲得的經驗會<b>加倍奪回</b>，直到全部拿回來。${S.demon ? '再獲得 100 經驗即可驅散心中暗影。' : ''}</p><button class="btn" onclick="closeModal()">重新出發</button>`), 900);
  loadFrontier();
  checkBadges();
  const h = location.hash;
  const m = h.match(/ch=(\d+)/);
  if (!getPlace(S.course || 'pv') && !placeSkipped(S.course || 'pv')) go('placement', S.course || 'pv');
  else if (m && CH.find(c => c.id === +m[1]) && unlocked(CH.find(c => c.id === +m[1]))) go('chapter', +m[1]);
  else if (/#(tools|formulas|glossary|wrong|hall|me|frontier|instr)\b/.test(h)) go(h.slice(1).split(/[&?]/)[0]);
  else go('map');
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal' && !ARENA.playing) closeModal(); });
$('#btnTicket').onclick = async () => {
  const p = $('#pass').value; if (!p) return;
  $('#errTicket').textContent = '驗證中…';
  if (await tryTicket(p)) showLogin();
};
$('#pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnTicket').click(); });
$('#btnLogin').onclick = () => doLogin($('#sid').value, $('#sname').value, $('#snick').value);
$('#snick').addEventListener('keydown', e => { if (e.key === 'Enter') $('#btnLogin').click(); });
function showLogin() {
  $('#stepTicket').classList.add('hidden'); $('#stepLogin').classList.remove('hidden');
  const w = LS.get(KEYP + 'who', null); if (w) { $('#sid').value = w.sid; $('#sname').value = w.name; $('#snick').value = w.nick || ''; }
  $('#sid').focus();
}
window.addEventListener('beforeunload', () => { if (S) { leaveChapter(); Rec.flush(true); } });
(async function boot() {
  const vm = location.hash.match(/[#&]v=([^&]+)/);
  if (vm) {
    try { loadContent(await decryptView(decodeURIComponent(vm[1]))); return startGuest(); }
    catch (e) { $('#errTicket').textContent = '預覽連結已失效（老師可能更換了通行碼或預覽碼）。'; return; }
  }
  // QR code 入場券：網址 #t=通行碼
  const m = location.hash.match(/[#&]t=([^&]+)/);
  let pass = m ? decodeURIComponent(m[1]) : LS.get(KEYP + 'ticket', null);
  if (m) history.replaceState(null, '', location.pathname + location.search);
  if (pass && await tryTicket(pass, true)) {
    const w = LS.get(KEYP + 'who', null);
    if (w && w.nick && !m) return doLogin(w.sid, w.name, w.nick, true);
    showLogin();
  } else if (pass) { LS.del(KEYP + 'ticket'); $('#errTicket').textContent = '入場券已失效（老師可能更換了通行碼），請輸入新的通行碼。'; }
})();
</script>
